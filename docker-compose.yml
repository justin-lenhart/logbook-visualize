services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: unless-stopped
    ports:
      # Tailscale IP ONLY — never 0.0.0.0 (TS_IP in .env)
      - "${TS_IP}:3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SITE_URL: "http://${TS_IP}:3000"
      # crushbox has 31 GB RAM shared with the media stack — 1 GB is plenty here
      JAVA_OPTS: "-Xmx1g"
      MB_ANON_TRACKING_ENABLED: "false"
    volumes:
      - /srv/appdata/metabase/data:/metabase-data
      # Read-only mount of the synced SQLite copy of the Grist Logbook doc
      - /srv/appdata/metabase/db:/logbook:ro
